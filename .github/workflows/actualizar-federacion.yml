# Lee los datos de la Federación Vizcaína y actualiza la web sola.
# Se ejecuta sola 2 veces al día (y también se puede lanzar a mano: Actions → Actualizar datos de la Federación → Run workflow).
# La Federación corta a cada máquina de GitHub tras unas cuantas páginas (y bloquea del todo a centros de datos como
# Hetzner). Por eso hay un robot (una máquina distinta) por equipo, cada uno con sus propias páginas, y al final
# otro robot junta lo de todos y guarda una sola vez. Los equipos salen de EQUIPOS en actualizar_federacion.py:
# al añadir uno allí (p. ej. el Alevín cuando empiece su liga), aquí sale un robot más sin tocar nada.
# Si un equipo no se puede leer, conserva sus últimos datos buenos hasta la siguiente pasada.
name: Actualizar datos de la Federación

on:
  workflow_dispatch:
  schedule:
    # Horas en UTC (en Madrid, +2 en verano y +1 en invierno): justo antes de que n8n ofrezca las publicaciones
    # (8:30 y 23:30 en Madrid).
    - cron: "0 6 * * *"
    - cron: "0 21 * * *"

permissions:
  contents: write

concurrency:
  group: actualizar-federacion
  cancel-in-progress: false

jobs:
  equipos:
    runs-on: ubuntu-latest
    outputs:
      lista: ${{ steps.lista.outputs.lista }}
    steps:
      - uses: actions/checkout@v4
      - id: lista
        run: echo "lista=$(python3 actualizar_federacion.py --lista)" >> "$GITHUB_OUTPUT"

  leer:
    # Un robot por equipo. Cada uno lee solo las páginas de su equipo (clasificación, calendario, resultados de las
    # jornadas nuevas, actas nuevas, próximas jornadas, porteros y goleadores) y deja lo leído para el robot "juntar".
    needs: equipos
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false            # si un equipo falla, los demás siguen
      matrix:
        equipo: ${{ fromJson(needs.equipos.outputs.lista) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Pillow (para dejar ligeros los escudos de los rivales)
        run: python3 -m pip install --quiet pillow

      - name: Leer la Federación (${{ matrix.equipo }})
        run: |
          mkdir -p robot
          python3 actualizar_federacion.py --equipo ${{ matrix.equipo }} robot/parcial-${{ matrix.equipo }}.json \
            || echo "::warning::${{ matrix.equipo }}: no se pudo leer todo"
          # Escudos nuevos de rivales que haya bajado este robot
          git ls-files --others --exclude-standard img/escudos | while read -r f; do
            mkdir -p "robot/$(dirname "$f")"; cp "$f" "robot/$f"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: parcial-${{ matrix.equipo }}
          path: robot/
          retention-days: 1
          if-no-files-found: ignore

  juntar:
    needs: leer
    if: always()                  # aunque algún equipo haya fallado: los demás se guardan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          pattern: parcial-*
          path: robot
          merge-multiple: true

      - name: Guardar una copia de los datos de antes (para avisar de los cambios)
        run: cp datos-federacion.js "$RUNNER_TEMP/datos-antes.js"

      - name: Juntar lo de todos los robots
        # El equipo que no se haya leído conserva sus últimos datos buenos
        run: |
          if [ -d robot/img/escudos ]; then mkdir -p img/escudos; cp -n robot/img/escudos/* img/escudos/; fi
          python3 actualizar_federacion.py --juntar robot/parcial-*.json \
            || echo "::warning::No se pudieron actualizar todos los equipos"

      - name: Instalar el navegador que dibuja las publicaciones de Instagram
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium

      - name: Generar las publicaciones de Instagram (redes/salida)
        # Si falla, la web se guarda igual; n8n seguirá viendo las imágenes anteriores
        run: python3 redes/generar_redes.py || echo "::warning::No se pudieron generar las publicaciones"

      - name: Detectar cambios de partido (avisos a la directiva por Telegram, los manda n8n)
        run: python3 redes/detectar_cambios.py "$RUNNER_TEMP/datos-antes.js" datos-federacion.js || echo "::warning::No se pudieron detectar los cambios"

      - name: Guardar los cambios en la web
        run: |
          git add datos-federacion.js
          if [ -d calendario ]; then git add calendario/; fi
          if [ -d img/escudos ]; then git add img/escudos/; fi
          if [ -d redes/salida ]; then git add redes/salida/; fi
          if [ -d redes/escudos ]; then git add redes/escudos/; fi
          if git diff --cached --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git -c user.name="Actualización automática" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Datos de la Federación actualizados"
          git pull --rebase   # por si mientras tanto se ha mergeado otro cambio en la web
          git push
